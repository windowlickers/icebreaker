# Default values for icebreaker.

replicaCount: 2

image:
  repository: ghcr.io/windowlickers/icebreaker
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

# Icebreaker configuration
icebreaker:
  # Proxy port
  port: 8080
  # Request timeout in seconds
  timeout: 30
  # Log level (trace, debug, info, warn, error)
  logLevel: info
  # Output logs as JSON
  logJson: true

  # Metrics configuration
  metrics:
    enabled: true
    port: 9090

  # Health endpoint configuration
  health:
    enabled: true
    port: 9091
    livenessPath: /healthz
    readinessPath: /readyz

  # Graceful shutdown configuration
  shutdown:
    # Timeout for draining connections
    timeout: 30
    # Delay before starting shutdown (allows load balancer to remove pod)
    delay: 5

  # Secret key configuration
  # Either provide secretKey directly (not recommended for production)
  # or reference an existing secret
  secretKey: ""
  existingSecret: ""
  existingSecretKey: "secret-key"

  # Replay detection configuration
  replayDetection:
    enabled: false
    # Backend: "memory" or "redis"
    backend: redis
    # Nonce TTL in seconds
    nonceTtl: 86400

  # Key ID for the secret key
  keyId: "primary"

service:
  type: ClusterIP
  port: 8080
  # Annotations for the service (e.g., for service mesh)
  annotations: {}

# Metrics service (separate from main service for Prometheus scraping)
metricsService:
  enabled: true
  port: 9090
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: icebreaker.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: icebreaker-tls
  #    hosts:
  #      - icebreaker.local

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Liveness and readiness probes
# Uses the dedicated health endpoint for proper health checks
livenessProbe:
  httpGet:
    path: /healthz
    port: health
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: health
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

nodeSelector: {}

tolerations: []

affinity: {}
  # podAntiAffinity:
  #   preferredDuringSchedulingIgnoredDuringExecution:
  #     - weight: 100
  #       podAffinityTerm:
  #         labelSelector:
  #           matchExpressions:
  #             - key: app.kubernetes.io/name
  #               operator: In
  #               values:
  #                 - icebreaker
  #         topologyKey: kubernetes.io/hostname

# Network Policy
networkPolicy:
  enabled: false
  # Allow ingress from specific namespaces or pods
  ingress: []
  # Allow egress to specific destinations
  egress: []

# Redis for replay detection
redis:
  enabled: false
  image:
    repository: redis
    tag: "8.0.2"
    pullPolicy: IfNotPresent
  port: 6379
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# ServiceMonitor for Prometheus Operator
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  honorLabels: false
  metricRelabelings: []
  relabelings: []
