apiVersion: v1
kind: Service
metadata:
  name: {{ include "icebreaker.fullname" . }}
  labels:
    {{- include "icebreaker.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "icebreaker.selectorLabels" . | nindent 4 }}
---
{{- if and .Values.icebreaker.metrics.enabled .Values.metricsService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "icebreaker.fullname" . }}-metrics
  labels:
    {{- include "icebreaker.labels" . | nindent 4 }}
  {{- with .Values.metricsService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.metricsService.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "icebreaker.selectorLabels" . | nindent 4 }}
{{- end }}
