[package]
name = "icebreaker-cli"
description = "CLI binary for the Icebreaker tokenizer proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "icebreaker"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
icebreaker-common = { workspace = true }
icebreaker-crypto = { workspace = true }
icebreaker-proxy = { workspace = true }
icebreaker-sso = { workspace = true }

# Async runtime
tokio = { workspace = true }

# HTTP
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }

# Tower
tower = { workspace = true }
tower-http = { workspace = true }

# CLI
clap = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
bytes = { workspace = true }
http-body = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# TLS
hyper-rustls = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }

# Cryptography (for seal command)
crypto_box = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Secret management
secrecy = { workspace = true }

# Utilities
rand = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
