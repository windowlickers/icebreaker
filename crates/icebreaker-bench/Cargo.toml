[package]
name = "icebreaker-bench"
description = "Benchmarks for the Icebreaker tokenizer proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

# This crate contains only benchmarks, no library code
[lib]
path = "src/lib.rs"

# Don't apply strict workspace lints to benchmarks
[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"

[dependencies]
icebreaker-common = { workspace = true }
icebreaker-crypto = { workspace = true }
icebreaker-proxy = { workspace = true }

# Criterion for benchmarking
criterion = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# HTTP types
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }

# Secret handling
secrecy = { workspace = true }

# Utilities
bytes = { workspace = true }
futures = { workspace = true }

# For throughput benchmarks
wiremock = { workspace = true }

# Allocation profiling
dhat = { workspace = true }

[[bench]]
name = "allocation_benchmarks"
harness = false

[[bench]]
name = "crypto_benchmarks"
harness = false

[[bench]]
name = "middleware_benchmarks"
harness = false

[[bench]]
name = "scanning_benchmarks"
harness = false

[[bench]]
name = "throughput_benchmarks"
harness = false

[[bench]]
name = "network_benchmarks"
harness = false

[[bench]]
name = "processor_benchmarks"
harness = false

[[bench]]
name = "metrics_benchmarks"
harness = false
