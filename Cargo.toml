[workspace]
resolver = "2"
members = [
    "crates/icebreaker",
    "crates/icebreaker-common",
    "crates/icebreaker-crypto",
    "crates/icebreaker-proxy",
    "crates/icebreaker-audit",
    "crates/icebreaker-sso",
    "crates/icebreaker-cli",
    "crates/icebreaker-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/windowlickers/icebreaker"
rust-version = "1.75"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
cognitive_complexity = "warn"
large_enum_variant = "warn"
large_types_passed_by_value = "warn"
needless_pass_by_value = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# HTTP
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.2"
http-body = "1.0"
http-body-util = "0.1"

# Tower middleware
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["full"] }
tower-service = "0.3"

# Cryptography
crypto_box = "0.9"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
subtle = "2.6"

# AWS signing
aws-sigv4 = { version = "1", features = ["sign-http"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }

# Secret management
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rmp-serde = "1.3"
base64 = "0.22"

# Database (optional)
sqlx = { version = "0.8", features = ["runtime-tokio"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Error handling
thiserror = "2.0"

# Date/time
time = { version = "0.3", features = ["macros", "parsing"] }

# Compression
async-compression = { version = "0.4", features = ["tokio", "gzip", "deflate", "brotli", "zstd"] }
tokio-util = { version = "0.7", features = ["io"] }

# Utilities
bytes = "1.9"
futures = "0.3"
futures-util = "0.3"
pin-project-lite = "0.2"
url = "2.5"
regex = "1.11"
hex = "0.4"
ipnet = "2.9"
cookie = { version = "0.18", features = ["percent-encode"] }
urlencoding = "2.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# TLS
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "native-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2.2"
x509-parser = "0.17"
webpki-roots = "0.26"

# Testing
wiremock = "0.6"
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"
