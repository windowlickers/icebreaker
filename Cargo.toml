[workspace]
resolver = "2"
members = [
    "crates/icebreaker",
    "crates/icebreaker-common",
    "crates/icebreaker-crypto",
    "crates/icebreaker-proxy",
    "crates/icebreaker-audit",
    "crates/icebreaker-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/windowlickers/icebreaker"
rust-version = "1.75"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
cognitive_complexity = "warn"
large_enum_variant = "warn"
large_types_passed_by_value = "warn"
needless_pass_by_value = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# HTTP
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.2"
http-body = "1.0"
http-body-util = "0.1"

# Tower middleware
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["full"] }
tower-service = "0.3"

# Cryptography
crypto_box = "0.9"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
subtle = "2.6"

# Secret management
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

# Database (optional)
sqlx = { version = "0.8", features = ["runtime-tokio"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0"

# Utilities
bytes = "1.9"
futures = "0.3"
futures-util = "0.3"
pin-project-lite = "0.2"
url = "2.5"
regex = "1.11"
hex = "0.4"

# Testing
wiremock = "0.6"
