name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

env:
  ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
  ATTIC_URL: ${{ vars.ATTIC_URL }}

jobs:
  fmt:
    runs-on: nix-latest
    container:
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup attic
        run: |
          attic login ci "$ATTIC_URL" "$ATTIC_TOKEN"
          attic use ci
      - name: cargo fmt
        run: nix build .#checks.x86_64-linux.fmt --print-build-logs
      - name: Push to attic
        run: attic push ci ./result

  clippy:
    runs-on: nix-latest
    container:
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup attic
        run: |
          attic login ci "$ATTIC_URL" "$ATTIC_TOKEN"
          attic use ci
      - name: cargo clippy
        run: nix build .#checks.x86_64-linux.clippy --print-build-logs
      - name: Push to attic
        run: attic push ci ./result

  tests:
    runs-on: nix-latest
    container:
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup attic
        run: |
          attic login ci "$ATTIC_URL" "$ATTIC_TOKEN"
          attic use ci
      - name: cargo test
        run: nix build .#checks.x86_64-linux.tests --print-build-logs
      - name: Push to attic
        run: attic push ci ./result

  audit:
    runs-on: nix-latest
    container:
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup attic
        run: |
          attic login ci "$ATTIC_URL" "$ATTIC_TOKEN"
          attic use ci
      - name: cargo audit
        run: nix build .#checks.x86_64-linux.audit --print-build-logs
      - name: Push to attic
        run: attic push ci ./result

  deny:
    runs-on: nix-latest
    container:
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup attic
        run: |
          attic login ci "$ATTIC_URL" "$ATTIC_TOKEN"
          attic use ci
      - name: cargo deny
        run: nix build .#checks.x86_64-linux.deny --print-build-logs
      - name: Push to attic
        run: attic push ci ./result

  build:
    runs-on: nix-latest
    container:
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup attic
        run: |
          attic login ci "$ATTIC_URL" "$ATTIC_TOKEN"
          attic use ci
      - name: Build icebreaker
        run: nix build .#icebreaker --print-build-logs
      - name: Push icebreaker to attic
        run: attic push ci ./result
      - name: Build icebreaker-cli
        run: nix build .#icebreaker-cli --print-build-logs
      - name: Push icebreaker-cli to attic
        run: attic push ci ./result
      - name: Verify CLI binary
        run: |
          test -x result/bin/icebreaker
          result/bin/icebreaker --version

  image:
    runs-on: nix-latest
    container:
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup attic
        run: |
          attic login ci "$ATTIC_URL" "$ATTIC_TOKEN"
          attic use ci
      - name: Build container image
        run: nix build .#icebreaker-image --print-build-logs
      - name: Push to attic
        run: attic push ci ./result
      - name: Verify image archive
        run: test -f result
      - name: Push image to registry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          nix shell nixpkgs#skopeo --command skopeo --insecure-policy copy \
            --dest-creds "$DOCKER_USERNAME:$DOCKER_PASSWORD" \
            "docker-archive:$(readlink -f result)" \
            "docker://$DOCKER_REGISTRY/icebreaker:$version"
          nix shell nixpkgs#skopeo --command skopeo --insecure-policy copy \
            --dest-creds "$DOCKER_USERNAME:$DOCKER_PASSWORD" \
            "docker-archive:$(readlink -f result)" \
            "docker://$DOCKER_REGISTRY/icebreaker:latest"
